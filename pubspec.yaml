name: domiday
description: Личный, полностью локальный дневник поездок.
publish_to: 'none'
version: 1.0.3+46

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.5
  intl: ^0.20.3
  geolocator: ^14.0.3
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Manrope (SIL OFL 1.1, assets/fonts/OFL-Manrope.txt): заголовки и числа.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
  generate: true
  assets:
    - assets/countries.json
    - assets/borders.json
    - assets/disputed.json
    - assets/flags/
